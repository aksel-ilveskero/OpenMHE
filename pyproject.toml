[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openmhe"
version = "0.1.0"
description = "Moving horizon estimation with Acados and composable MHE cost terms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenMHE contributors" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "casadi>=3.6",
]

[project.optional-dependencies]
opentorsion = ["opentorsion"]
demo = ["matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/your-org/OpenMHE"

[tool.setuptools.packages.find]
where = ["."]
include = ["openmhe*"]
